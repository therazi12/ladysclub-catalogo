<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Pedidos · Lady's Club</title>
<style>
:root{--r:#C88A96;--b:#280201;--h:#F7F5F0;--p:#EFD9DD;--line:rgba(40,2,1,.14)}
*{box-sizing:border-box;margin:0}body{background:var(--h);color:var(--b);font:15px/1.5 system-ui,sans-serif;padding:20px;max-width:900px;margin:auto}
h1{font-size:26px;margin-bottom:14px}input,button,select{font:inherit;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--b)}
button{cursor:pointer;background:var(--b);color:#fff;border:0;font-weight:700}button.s{background:#fff;color:var(--b);border:1.5px solid var(--b)}
.o{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.o h3{display:flex;justify-content:space-between;gap:8px;font-size:17px}.st{font-size:12px;border-radius:999px;padding:3px 10px;background:var(--p)}
.st.nuevo{background:#ffe3a3}.st.pagado{background:#bfe8c4}.st.enviado{background:#c9d9f5}.st.cancelado{background:#ddd}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:8px 0;font-size:14px}.g span{color:#6b5560}
.a{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}img.pf{max-width:100%;max-height:420px;border-radius:12px;margin-top:10px;display:block}
@media(max-width:560px){.g{grid-template-columns:1fr}}
</style></head><body>
<h1>Pedidos · Lady's Club</h1>
<div id="login"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"> <button id="go">Entrar</button> <p id="er" style="color:#b3261e;margin-top:8px"></p></div>
<div id="app" hidden><div class="a"><button class="s" id="rf">Actualizar</button><select id="ft"><option value="">Todos</option><option>nuevo</option><option>pagado</option><option>enviado</option><option>cancelado</option></select><button class="s" id="out">Salir</button></div><div id="list"></div></div>
<script>
const $=s=>document.querySelector(s);let TOK='',ORD=[];
try{TOK=sessionStorage.getItem('lc_admin')||''}catch(e){}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=()=>({Authorization:'Bearer '+TOK});
async function load(){
 const r=await fetch('/api/admin/orders',{headers:H()});
 if(r.status===401){TOK='';try{sessionStorage.removeItem('lc_admin')}catch(e){};$('#login').hidden=false;$('#app').hidden=true;$('#er').textContent=TOK?'':'Contraseña incorrecta o aún no configurada';return}
 ORD=(await r.json()).orders;$('#login').hidden=true;$('#app').hidden=false;draw()}
function draw(){
 const f=$('#ft').value;
 $('#list').innerHTML=ORD.filter(o=>!f||o.status===f).map(o=>{const it=JSON.parse(o.items||'[]');return `<div class="o" data-c="${o.code}">
 <h3><span>${o.code} · ${esc(o.name)}</span><span class="st ${o.status}">${o.status}</span></h3>
 <div style="color:#6b5560;font-size:13px">${new Date(o.created_at).toLocaleString('es-EC')}</div>
 <ul style="margin:8px 0 8px 18px">${it.map(i=>`<li>${i.q} × ${esc(i.name)}${i.state==='pre'?' (reserva)':''}</li>`).join('')}</ul>
 <div class="g"><div><span>Paga ahora</span> $${(+o.pay_now).toFixed(2)}</div><div><span>Al llegar</span> $${(+o.pay_later).toFixed(2)}</div>
 <div><span>Cédula</span> ${esc(o.ci)}</div><div><span>Celular</span> <a href="https://wa.me/593${esc(o.tel).slice(1)}" target="_blank">${esc(o.tel)}</a></div>
 <div><span>Correo</span> ${esc(o.email)}</div><div><span>Envío</span> ${esc(o.prov)}, ${esc(o.city)}</div>
 <div style="grid-column:1/-1"><span>Dirección</span> ${esc(o.addr)}</div></div>
 ${o.has_proof?`<button class="s" data-p="${o.code}">Ver comprobante</button>`:'<i style="color:#6b5560">Sin comprobante (revisa Instagram)</i>'}
 <div class="a"><button data-s="pagado">Pago confirmado</button><input data-t placeholder="N.º de guía" value="${esc(o.tracking||'')}" style="width:150px"><button data-s="enviado">Enviado</button><button class="s" data-s="cancelado">Cancelar</button></div></div>`}).join('')||'<p style="margin-top:16px">No hay pedidos.</p>'}
$('#list').onclick=async e=>{
 const c=e.target.closest('.o');if(!c)return;const code=c.dataset.c;
 if(e.target.dataset.p){const r=await fetch('/api/admin/proof/'+code,{headers:H()});if(!r.ok)return;const u=URL.createObjectURL(await r.blob());e.target.outerHTML=`<img class="pf" src="${u}" alt="Comprobante">`}
 if(e.target.dataset.s){await fetch('/api/admin/status',{method:'POST',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({code,status:e.target.dataset.s,tracking:c.querySelector('[data-t]').value||null})});load()}};
$('#go').onclick=()=>{TOK=$('#pw').value;try{sessionStorage.setItem('lc_admin',TOK)}catch(e){}load()};
$('#pw').onkeydown=e=>e.key==='Enter'&&$('#go').click();
$('#rf').onclick=load;$('#ft').onchange=draw;$('#out').onclick=()=>{TOK='';try{sessionStorage.removeItem('lc_admin')}catch(e){};location.reload()};
if(TOK)load();
</script></body></html>
